name: Static preview checks
on: [push, pull_request]
jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: node verify.mjs
